[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convexrisk"
version = "0.1.0"
description = "Efficient portfolios under convex risk measures: mono-period, discrete-time, continuous-time, and a distributionally-robust extension."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Corentin Stephan"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
